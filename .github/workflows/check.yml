name: Monitor Alertas DAM

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Límite global para todo el job (opcional)
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2

      - name: Instalar dependencias de R
        run: |
          options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/jammy/latest"))
          install.packages(c("httr", "readxl", "digest", "jsonlite"))
        shell: Rscript {0}

      - name: Ejecutar Script
        timeout-minutes: 10 # Cancela el paso si dura más de 10 minutos
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: Rscript script.R

      - name: Guardar estado en GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add estado_hashes.json
          git commit -m "Auto-update hash state" || exit 0
          git push
